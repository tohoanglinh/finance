<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tài chính cá nhân</title>
<style>
  :root{--bg:#f5f7fa;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--pri:#2563eb;--pos:#16a34a;--neg:#dc2626;--warn:#d97706}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:600}
  nav button.on{background:#e8f0fe;color:var(--pri)}
  main{max-width:1100px;margin:0 auto;padding:16px}
  .tab{display:none}.tab.on{display:block}
  [hidden]{display:none !important}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .card h3{margin:0 0 8px;font-size:13px;color:var(--mute);font-weight:600}
  .big{font-size:20px;font-weight:700}
  .sub{color:var(--mute);font-size:12px;margin-top:2px}
  .pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .row h2{margin:0;font-size:16px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:#f9fafb;font-size:12px;color:var(--mute)}
  td.n,th.n{text-align:right}
  .scroll{overflow-x:auto;border-radius:12px}
  button.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
  button.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
  button.lnk{background:none;border:0;color:var(--pri);cursor:pointer;padding:2px 6px}
  button.lnk.del{color:var(--neg)}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:#eef2ff;color:#3730a3}
  .badge.g{background:#dcfce7;color:#166534}.badge.o{background:#fef3c7;color:#92400e}.badge.x{background:#f3f4f6;color:#6b7280}
  .stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:8px}
  .bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mute)}
  .bars .col{width:100%;max-width:38px;display:flex;flex-direction:column;justify-content:flex-end;border-radius:4px 4px 0 0;overflow:hidden}
  dialog{border:0;border-radius:14px;padding:0;width:min(520px,94vw);box-shadow:0 10px 40px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .dlg{padding:18px}.dlg h2{margin:0 0 12px;font-size:16px}
  label{display:block;font-size:12px;color:var(--mute);margin:10px 0 3px;font-weight:600}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font:inherit;background:#fff}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .err{color:var(--neg);font-size:12px;margin-top:8px;min-height:16px}
  .note{background:#fffbeb;border:1px solid #fde68a;color:#78350f;border-radius:10px;padding:10px 12px;font-size:12px;margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv.t{font-weight:700;border-bottom:0;border-top:2px solid var(--line);margin-top:4px;padding-top:8px}
  .sc-wrap{position:relative}
  .sc-wrap svg{display:block;width:100%;height:auto;overflow:visible}
  .sc-hit{fill:transparent;cursor:pointer}
  .sc-tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);padding:8px 10px;font-size:12.5px;line-height:1.5;z-index:5;white-space:nowrap;display:none}
  .sc-tip b{font-size:14px}
  .sc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 12px}
  .sc-stats>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .sc-stats .v{font-size:18px;font-weight:700}
  .pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 4px}
  .pager button{min-width:34px;padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;font:inherit}
  .pager button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
  .pager button:disabled{opacity:.45;cursor:default}
  .pl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:0 0 10px}
  .pl>div{flex:1 1 200px}
  .pl label{display:block;margin:0 0 4px}
  .lk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 14px;background:#fff}
  .lk td.v{word-break:break-all}
  .lk tr.ov td{background:#fffbeb}
  .pbar{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .pbar i{display:block;height:100%;border-radius:99px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 14px;cursor:pointer;font:inherit;font-weight:600;color:var(--mute)}
  .seg button.on{background:#e8f0fe;color:var(--pri)}
  input.spamt{width:150px;text-align:right}
  .ytbl td,.ytbl th{white-space:nowrap}
  .chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:4px 2px;margin:10px 0}
  .msg{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.5;word-break:break-word}
  .msg.u{align-self:flex-end;background:#e8f0fe;border-bottom-right-radius:4px;white-space:pre-wrap}
  .msg.a{align-self:flex-start;background:#f3f4f6;border-bottom-left-radius:4px}
  .msg.a p{margin:3px 0}.msg.a ul{margin:3px 0;padding-left:18px}.msg.a h4{margin:8px 0 3px}
  .typing .dots::after{content:'';animation:bd 1.2s steps(4,end) infinite}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--pri)}
  .chatform{display:flex;gap:8px;align-items:flex-end}
  .chatform textarea{flex:1;min-height:42px;max-height:120px;resize:vertical;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:12px}
  .empty{padding:24px;text-align:center;color:var(--mute);background:var(--card);border:1px dashed var(--line);border-radius:12px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
  .toolbar input,.toolbar select{width:auto;flex:1 1 150px;min-width:130px;max-width:240px}
  .toolbar input[type=search]{flex:2 1 200px;max-width:300px}
  th.sortable{cursor:pointer;user-select:none}
  th.sortable:hover{color:var(--pri)}
  th.sortable.on{color:var(--pri)}
  th .arr{margin-left:4px;font-size:10px;opacity:.5}
  th.sortable.on .arr{opacity:1}
  #toasts{position:fixed;inset:auto;top:16px;right:16px;left:auto;bottom:auto;margin:0;padding:0;border:0;background:none;overflow:visible;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}
  #toasts:not(:popover-open){display:flex}
  .toast{pointer-events:auto;display:flex;align-items:flex-start;gap:10px;background:#fff;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:10px;padding:11px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);font-weight:500;animation:tin .22s ease-out}
  .toast.ok{border-left-color:var(--pos)}.toast.bad{border-left-color:var(--neg)}.toast.warn{border-left-color:var(--warn)}
  .toast .ic{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;background:var(--pri)}
  .toast.ok .ic{background:var(--pos)}.toast.bad .ic{background:var(--neg)}.toast.warn .ic{background:var(--warn)}
  .toast.out{animation:tout .2s ease-in forwards}
  @keyframes tin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes tout{to{opacity:0;transform:translateX(24px)}}
  dialog[open]{animation:dpop .16s ease-out}
  @keyframes dpop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .err:not(:empty){background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 10px}
  button:disabled{opacity:.6;cursor:not-allowed}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .boot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:50vh;color:var(--mute);font-weight:500}
  .boot .ring{width:46px;height:46px;border:4px solid #dbe4f5;border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite}
  .boot .dots::after{content:'';animation:bd 1.4s steps(4,end) infinite}
  @keyframes bd{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
  @media (prefers-reduced-motion:reduce){.boot .ring{animation-duration:2.4s}}
  button.btn.danger{background:var(--neg)}
  #savTbl{scroll-margin-top:72px}
  .dash{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
  .dash .span2{grid-column:1/-1}
  .dash .hero .big{font-size:30px}
  .dash .mid{font-size:17px;font-weight:700;margin-top:2px}
  .invrow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 32px;flex-wrap:wrap}
  .invstats{display:flex;gap:16px 32px;flex-wrap:wrap}
  @media(max-width:620px){.dash{grid-template-columns:1fr}.dash .hero .big{font-size:26px}}
  .aitext h4{margin:14px 0 4px;font-size:14px}
  .aitext p{margin:4px 0}
  .aitext ul{margin:4px 0 8px;padding-left:20px}
  .aitext li{margin:3px 0}
  .aipre{white-space:pre-wrap;font-size:11px;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:8px;max-height:240px;overflow:auto}
  .pager{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:12px}
  .pager button{min-width:34px;padding:6px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
  .pager button:hover:not(:disabled){border-color:var(--pri);color:var(--pri)}
  .pager button.on{background:var(--pri);border-color:var(--pri);color:#fff}
  .pager .gap{color:var(--mute);padding:0 4px}
  dialog#dlg .dlg{max-height:88vh;overflow-y:auto}
  input.chg{border-color:var(--warn);background:#fffbeb}
  #cdlg{width:min(400px,92vw)}
  #cdlg p{margin:0 0 4px;color:var(--ink)}
  .incd summary{list-style:none;cursor:pointer}
  .incd summary::-webkit-details-marker{display:none}
  .incd .car{display:inline-block;transition:transform .15s;color:var(--mute)}
  .incd[open] .car{transform:rotate(90deg)}
  .incd .incs{padding:2px 0 8px 18px;background:#fafafa}
  .incd .incs .kv{font-size:13px}
  .cb{position:relative}
  .cb input{padding-right:36px}
  .cbtn{position:absolute;right:4px;top:4px;bottom:4px;width:30px;border:0;background:none;color:var(--mute);cursor:pointer;font-size:14px;border-radius:6px}
  .cbtn:hover{background:#f3f4f6}
  .cbl{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:200px;overflow-y:auto;z-index:20}
  .cbi{padding:8px 12px;cursor:pointer}
  .cbi:hover{background:#e8f0fe;color:var(--pri)}
  .cbe{padding:8px 12px;color:var(--mute);font-size:12px}
  @media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>💰 Tài chính cá nhân</h1>
  <nav id="nav">
    <button data-t="dash" class="on">Tổng quan</button>
    <button data-t="sav">Tiết kiệm</button>
    <button data-t="inv">Đầu tư</button>
    <button data-t="spend">Chi tiêu</button>
    <button data-t="sal">Lương &amp; Thuế</button>
    <button data-t="cfg">Cài đặt</button>
  </nav>
</div></header>
<main>
  <section id="t-dash" class="tab on"><div class="boot" role="status" aria-live="polite"><div class="ring"></div><div>Đang tải dữ liệu<span class="dots"></span></div><div class="sub">Lần mở đầu có thể mất vài giây</div></div></section>
  <section id="t-sav" class="tab"></section>
  <section id="t-inv" class="tab"></section>
  <section id="t-spend" class="tab"></section>
  <section id="t-sal" class="tab"></section>
  <section id="t-cfg" class="tab"></section>
</main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<dialog id="cdlg"><div class="dlg"><h2 id="cTitle">Xác nhận</h2><p id="cMsg"></p><div class="acts"><button type="button" class="btn ghost" id="cNo">Hủy</button><button type="button" class="btn danger" id="cYes">Xóa</button></div></div></dialog>
<div id="toasts" popover="manual"></div>

<script>
var S = null;
var TYPE_LABEL = { DEMAND: 'Không kỳ hạn', TERM_END: 'Có kỳ hạn - lãi cuối kỳ', TERM_MONTHLY: 'Có kỳ hạn - lãi hàng tháng' };
var CUR_LABEL = { VND: 'VND (₫)', USD: 'USD ($)', EUR: 'EUR (€)', JPY: 'JPY (¥)', SGD: 'SGD (S$)', GBP: 'GBP (£)', HKD: 'HKD (HK$)', AUD: 'AUD (A$)', CNY: 'CNY (¥)', KRW: 'KRW (₩)' };
var ASSET_LABEL = { STOCK: 'Cổ phiếu', FUND: 'Chứng chỉ quỹ', ETF: 'ETF', OTHER: 'Khác' };

// ---------- tiện ích ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function vnd(n){ return Math.round(Number(n)||0).toLocaleString('vi-VN') + ' ₫'; }
function num(n, d){ return (Number(n)||0).toLocaleString('vi-VN', {maximumFractionDigits: d == null ? 2 : d}); }
function pct(n){ return (Number(n)||0).toFixed(2) + '%'; }
function cls(n){ return n > 0 ? 'pos' : (n < 0 ? 'neg' : ''); }
function toast(m, type){
  type = type || 'info';
  var box = $('toasts');
  try { if (box.showPopover) { if (box.matches(':popover-open')) box.hidePopover(); box.showPopover(); } } catch (e) {}
  var t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<span class="ic">' + ({ok:'✓', bad:'!', warn:'!', info:'i'}[type] || 'i') + '</span><span>' + esc(m) + '</span>';
  box.appendChild(t);
  var done = function(){ t.classList.add('out'); setTimeout(function(){ t.remove(); if (!box.children.length) { try { box.hidePopover && box.hidePopover(); } catch (e) {} } }, 200); };
  t.onclick = done;
  setTimeout(done, type === 'bad' ? 6000 : (type === 'warn' ? 9000 : 2800));
}
function ok(m){ toast(m, 'ok'); }
function bad(m){ toast(m, 'bad'); }
// Hộp xác nhận riêng (confirm() của trình duyệt bị chặn trong iframe của Apps Script)
function askConfirm(msg, yesLabel, title){
  return new Promise(function(res){
    var d = $('cdlg');
    $('cTitle').textContent = title || 'Xác nhận';
    $('cMsg').textContent = msg;
    $('cYes').textContent = yesLabel || 'Đồng ý';
    var finish = function(v){ d.removeEventListener('cancel', onCancel); d.close(); res(v); };
    var onCancel = function(e){ e.preventDefault(); finish(false); };
    $('cYes').onclick = function(){ finish(true); };
    $('cNo').onclick = function(){ finish(false); };
    d.addEventListener('cancel', onCancel);
    d.showModal();
    $('cNo').focus();
  });
}
// Khóa nút + hiện "đang xử lý" trong lúc chờ máy chủ
function busy(btns, label, promise){
  btns = [].concat(btns).filter(Boolean);
  var old = btns.map(function(b){ return b.innerHTML; });
  btns.forEach(function(b, i){ b.disabled = true; if (i === 0 && label) b.innerHTML = '<span class="spin"></span>' + label; });
  var restore = function(){ btns.forEach(function(b, i){ b.disabled = false; b.innerHTML = old[i]; }); };
  return promise.then(function(v){ restore(); return v; }, function(e){ restore(); throw e; });
}
function call(action, payload){
  return new Promise(function(res, rej){
    var done = false;
    var timer = setTimeout(function(){ if (!done){ done = true; rej(new Error('Máy chủ phản hồi quá lâu (quá 90 giây). Tải lại trang để kiểm tra dữ liệu rồi thử lại.')); } }, 90000);
    var fin = function(f, v){ if (done) return; done = true; clearTimeout(timer); f(v); };
    google.script.run.withSuccessHandler(function(r){ r && r.ok ? fin(res, r.data) : fin(rej, new Error(r ? r.error : 'Lỗi không xác định')); })
      .withFailureHandler(function(e){ fin(rej, e); }).api(action, payload || {});
  });
}
function load(){
  return call('bootstrap').then(function(d){ S = d; renderAll(); }).catch(function(e){
    bad('Lỗi tải dữ liệu: ' + e.message);
    var b = document.querySelector('#t-dash .boot');
    if (b) b.innerHTML = '<div class="neg">Không tải được dữ liệu.</div><div class="sub">' + esc(e.message) + '</div><button class="btn" onclick="location.reload()">Tải lại</button>';
  });
}

// ---------- tab ----------
$('nav').addEventListener('click', function(e){
  var t = e.target.dataset.t; if (!t) return;
  [].forEach.call(document.querySelectorAll('nav button'), function(b){ b.classList.toggle('on', b.dataset.t === t); });
  [].forEach.call(document.querySelectorAll('.tab'), function(s){ s.classList.toggle('on', s.id === 't-' + t); });
});

document.addEventListener('click', function(e){
  var g = e.target.closest('[data-go]'); if (!g) return;
  var nb = document.querySelector('nav button[data-t="' + g.getAttribute('data-go') + '"]'); if (nb) nb.click();
});

// ---------- biểu mẫu dùng chung ----------
var FORMS = {
  savings: { title: 'Sổ tiết kiệm', fields: [
    {k:'name', l:'Ngân hàng / Tên sổ', t:'text'},
    {k:'type', l:'Loại', t:'select', o: TYPE_LABEL},
    {k:'principal', l:function(r){ return r.type === 'DEMAND' ? 'Số dư hiện tại (₫)' : 'Số tiền gốc (₫)'; }, t:'number'},
    {k:'rate', l:function(r){ return r.type === 'DEMAND' ? 'Lãi suất (%/năm) - tùy chọn, chỉ để ước tính, không cộng vào số dư' : 'Lãi suất (%/năm)'; }, t:'number', step:'0.01'},
    {k:'startDate', l:function(r){ return r.type === 'DEMAND' ? 'Ngày cập nhật số dư' : 'Ngày gửi'; }, t:'date'},
    {k:'termMonths', l:'Kỳ hạn (tháng)', t:'number', hideIf:function(r){ return r.type === 'DEMAND'; }},
    {k:'schedule', l:'Lịch trả lãi thực tế (tùy chọn). Mỗi dòng: ngày + số tiền, VD: 02/04/2026 6.575.342. Dòng cuối là ngày đáo hạn (có thể gồm cả gốc). Chỉ ghi ngày thì app tự tính lãi theo số ngày. Để trống = tính theo công thức gốc × lãi suất / 12', t:'textarea', hideIf:function(r){ return r.type !== 'TERM_MONTHLY'; }},
    {k:'status', l:'Trạng thái', t:'select', o:{active:'Đang gửi', closed:'Đã tất toán'}},
    {k:'note', l:'Ghi chú', t:'text'} ],
    def: function(){ return {type:'TERM_END', status:'active', startDate:S.today, termMonths:12}; } },
  tx: { title: 'Giao dịch đầu tư', fields: [
    {k:'date', l:'Ngày', t:'date'},

function initSymbolCombo(form){
  var cb = form.querySelector('.cb'); if (!cb) return;
  var inp = cb.querySelector('input'), list = cb.querySelector('.cbl'), btn = cb.querySelector('.cbtn');
  var syms = knownSymbols();
  function draw(filter){
    var f = String(filter || '').toUpperCase().trim();
    var items = syms.filter(function(x){ return !f || x.indexOf(f) >= 0; });
    list.innerHTML = items.length ? items.map(function(x){ return '<div class="cbi" data-v="' + esc(x) + '">' + esc(x) + '</div>'; }).join('')
      : '<div class="cbe">' + (syms.length ? 'Không có mã khớp - cứ gõ để thêm mã mới' : 'Chưa có mã nào - gõ để thêm mã mới') + '</div>';
  }
  function open(filter){ draw(filter); list.hidden = false; }
  function close(){ list.hidden = true; }
  inp.addEventListener('focus', function(){ open(''); });
  inp.addEventListener('click', function(){ if (list.hidden) open(''); });
  inp.addEventListener('input', function(){ open(inp.value); });
  inp.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !list.hidden){ e.stopPropagation(); e.preventDefault(); close(); } });
  btn.addEventListener('click', function(){ if (list.hidden){ open(''); inp.focus(); } else close(); });
  list.addEventListener('mousedown', function(e){ e.preventDefault(); });
  list.addEventListener('click', function(e){
    var it = e.target.closest('.cbi'); if (!it) return;
    inp.value = it.getAttribute('data-v'); close();
    inp.dispatchEvent(new Event('change', {bubbles: true}));
  });
  document.addEventListener('mousedown', function h(e){
    if (!document.body.contains(cb)) { document.removeEventListener('mousedown', h); return; }
    if (!cb.contains(e.target)) close();
  });
}
function keyOf(ent){ return ent === 'price' ? 'symbol' : 'id'; }
// Các mã đã từng nhập (giao dịch + bảng giá), duy nhất, sắp theo A-Z
function knownSymbols(){
  var seen = {}, out = [];
  (S.tx || []).concat(S.prices || []).forEach(function(r){
    var s = String(r.symbol || '').toUpperCase().trim();
    if (s && !seen[s]) { seen[s] = 1; out.push(s); }
  });
  return out.sort();
}

function openForm(ent, key, preset){
  var f = FORMS[ent];
  var rec = key ? JSON.parse(JSON.stringify(listOf(ent).filter(function(r){ return String(r[keyOf(ent)]) === String(key); })[0])) : f.def();
  if (preset) Object.keys(preset).forEach(function(k){ rec[k] = preset[k]; });
  delete rec.calc;
  function build(){
    var h = '<h2>' + (key ? 'Sửa' : 'Thêm') + ' ' + esc(f.title.toLowerCase()) + '</h2><form id="f">';
    f.fields.forEach(function(x){
      if (x.hideIf && x.hideIf(rec)) return;
      var v = rec[x.k] == null ? '' : rec[x.k];
      h += '<label>' + esc(typeof x.l === 'function' ? x.l(rec) : x.l) + '</label>';
      if (x.t === 'select'){
        var oo = typeof x.o === 'function' ? x.o() : x.o;
        h += '<select data-k="' + x.k + '">' + Object.keys(oo).map(function(o){ return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(oo[o]) + '</option>'; }).join('') + '</select>';
      } else if (x.t === 'textarea') {
        h += '<textarea data-k="' + x.k + '" rows="8" placeholder="02/04/2026 6.575.342&#10;05/05/2026 7.232.877&#10;...&#10;16/03/2027 803.068.493">' + esc(v) + '</textarea>';
      } else if (x.k === 'symbol' && (ent === 'tx' || ent === 'price') && !(ent === 'price' && key)) {
        // Ô Mã: chọn từ các mã đã có (giao dịch + bảng giá) hoặc gõ mã mới
        h += '<div class="cb"><input data-k="symbol" type="text" autocomplete="off" placeholder="Chọn mã đã có hoặc gõ mã mới" value="' + esc(v) + '">' +
          '<button type="button" class="cbtn" tabindex="-1" aria-label="Xổ danh sách mã">▾</button><div class="cbl" hidden></div></div>';
      } else {
        h += '<input data-k="' + x.k + '" type="' + x.t + '"' + (x.step ? ' step="' + x.step + '"' : '') + (ent === 'price' && x.k === 'symbol' && key ? ' readonly' : '') + ' value="' + esc(v) + '">';
      }
    });
    h += '<div class="err" id="ferr"></div><div class="acts"><button type="button" class="btn ghost" id="fc">Hủy</button><button type="submit" class="btn">Lưu</button></div></form>';
    $('dlgBody').innerHTML = h;
    var form = $('f');
    initSymbolCombo(form);
    form.addEventListener('change', function(e){
      if (e.target.dataset.k === 'type' || e.target.dataset.k === 'currency'){ collect(); build(); }
    });
    $('fc').onclick = function(){ $('dlg').close(); toast('Đã hủy, không lưu thay đổi', 'info'); };
    form.onsubmit = function(ev){
      ev.preventDefault(); collect();
      $('ferr').textContent = '';
      var p;
      if (ent === 'salary' && !rec.id && rec.endMonth) {
        var end = rec.endMonth; delete rec.endMonth;
        p = call('saveSalaryRange', {record: rec, endMonth: end}).then(function(r){
          ok('Đã lưu ' + r.total + ' tháng (' + r.created + ' mới, ' + r.updated + ' ghi đè)');
        });
      } else {
        delete rec.endMonth;
        p = call('save', {entity: ent, record: rec}).then(function(){
          ok(key ? 'Đã cập nhật ' + f.title.toLowerCase() : 'Đã thêm ' + f.title.toLowerCase());
        });
      }
      var save = form.querySelector('button[type=submit]'), cancel = $('fc');
      busy([save, cancel], 'Đang lưu...', p.then(function(){ $('dlg').close(); return load(); }))
        .then(function(){
          // Lấy giá tự động chạy riêng sau khi đã lưu xong, không giữ form lại
          if (ent === 'price' && String(rec.auto || '').trim()) {
            toast('Đang lấy giá ' + rec.symbol + ' từ Google Finance (có thể mất vài giây)...', 'info');
            return call('refreshPrices', {symbol: rec.symbol}).then(function(r){ reportRefresh(r); return load(); })
              .catch(function(e){ bad('Không lấy được giá tự động: ' + e.message); });
          }
        })
        .catch(function(e){ $('ferr').textContent = e.message; bad(e.message); });
    };
  }
  function collect(){
    [].forEach.call(document.querySelectorAll('#f [data-k]'), function(el){ rec[el.dataset.k] = el.value; });
  }
  build();
  $('dlg').showModal();
}

function reportRefresh(r){
  var fail = (r.results || []).filter(function(x){ return !x.ok; });
  if (r.updated) ok('Đã cập nhật giá tự động ' + r.updated + ' mã');
  if (fail.length) toast('Không lấy được giá tự động: ' + fail.map(function(x){ return x.symbol + ' — ' + (x.error || ''); }).join('; ') + '. Đang dùng giá nhập tay / giá giao dịch gần nhất.', 'warn');
  if (r.busy) { toast('Đang có một lần lấy giá khác chạy, hãy thử lại sau ít giây.', 'info'); return; }
  if (!r.updated && !fail.length) toast('Chưa có mã nào đặt giá tự động. Bấm "Sửa giá" hoặc "Giá tự động" ở dòng cổ phiếu để thiết lập.', 'info');
}

var AIR = null;
function mdLite(t){
  var out = [], inList = false;
  function inline(x){ return x.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  esc(t).split(/\r?\n/).forEach(function(l){
    var m = /^\s*[-*•]\s+(.*)$/.exec(l);
    if (m){ if (!inList){ out.push('<ul>'); inList = true; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    if (inList){ out.push('</ul>'); inList = false; }
    m = /^\s*#{1,4}\s+(.*)$/.exec(l);
    if (m) out.push('<h4>' + inline(m[1]) + '</h4>');
    else if (l.trim()) out.push('<p>' + inline(l.trim()) + '</p>');
  });
  if (inList) out.push('</ul>');
  return out.join('');
}

var CHAT = [], chatBusy = false, chatDraft = '';
var CHAT_SUGGEST = ['Tiền không kỳ hạn của tôi đủ chi tiêu khoảng mấy tháng?', 'Tháng này tôi đang chi vượt khoản nào?', 'Tôi nên làm gì với các sổ sắp đáo hạn?', 'Danh mục của tôi có đang quá tập trung không?'];
function drawChat(){
  var box = $('chatBox'); if (!box) return;
  var ready = !!(S && S.aiReady);
  var h = '<div class="row" style="margin:0"><h3 style="margin:0">Hỏi đáp với AI</h3>' + (CHAT.length ? '<button class="btn ghost" id="chatClear" type="button">Xóa cuộc trò chuyện</button>' : '') + '</div>' +
    '<div class="sub" style="margin-top:4px">Hỏi về tài sản, tiết kiệm, đầu tư, lương, chi tiêu của bạn. AI dùng số liệu tổng hợp mới nhất (không có tên sổ hay mã cổ phiếu), cuộc trò chuyện chỉ nằm trên trang này và mất khi tải lại.</div>';
  if (!ready) h += '<div class="note" style="margin-top:8px">Chưa cấu hình khóa API nên chưa dùng được. Xem mục "Phân tích bằng AI" trong README.</div>';
  if (!CHAT.length && ready) h += '<div class="chips">' + CHAT_SUGGEST.map(function(q, i){ return '<button type="button" data-q="' + i + '">' + esc(q) + '</button>'; }).join('') + '</div>';
  if (CHAT.length || chatBusy){
    h += '<div class="chat" id="chatList" aria-live="polite">' + CHAT.map(function(m){
      return m.role === 'user' ? '<div class="msg u">' + esc(m.text) + '</div>' : '<div class="msg a aitext">' + mdLite(m.text) + '</div>';
    }).join('') + (chatBusy ? '<div class="msg a typing"><span class="sub">AI đang trả lời<span class="dots"></span></span></div>' : '') + '</div>';
  }
  h += '<div class="chatform"><textarea id="chatIn" rows="1" placeholder="Nhập câu hỏi... (Enter để gửi, Shift+Enter xuống dòng)"' + (ready ? '' : ' disabled') + '>' + esc(chatDraft) + '</textarea>' +
    '<button class="btn" id="chatSend" type="button"' + (ready && !chatBusy ? '' : ' disabled') + '>Gửi</button></div>' +
    '<div class="sub" style="margin-top:6px">Câu trả lời của AI chỉ mang tính tham khảo, không phải tư vấn tài chính chuyên nghiệp.</div>';
  box.innerHTML = h;
  var list = $('chatList'); if (list) list.scrollTop = list.scrollHeight;
  var inp = $('chatIn');
  inp.oninput = function(){ chatDraft = inp.value; };
  inp.onkeydown = function(e){
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); sendChat(); }
  };
  $('chatSend').onclick = function(){ sendChat(); };
  var clr = $('chatClear'); if (clr) clr.onclick = function(){ if (!chatBusy){ CHAT = []; drawChat(); } };
  [].forEach.call(box.querySelectorAll('[data-q]'), function(b){ b.onclick = function(){ chatDraft = CHAT_SUGGEST[Number(b.getAttribute('data-q'))]; sendChat(); }; });
}
function sendChat(){
  var text = String(chatDraft || '').trim();
  if (!text || chatBusy || !(S && S.aiReady)) return;
  if (text.length > 2000){ bad('Câu hỏi quá dài (tối đa 2000 ký tự)'); return; }
  CHAT.push({role: 'user', text: text}); chatDraft = ''; chatBusy = true; drawChat();
  call('aiChat', {messages: CHAT.slice(-12)}).then(function(r){
    CHAT.push({role: 'assistant', text: r.text});
  }).catch(function(e){
    CHAT.pop(); chatDraft = text; bad(e.message);   // trả câu hỏi về ô nhập để gửi lại
  }).then(function(){ chatBusy = false; drawChat(); var i = $('chatIn'); if (i) i.focus(); });
}

    drawAi();
  }).catch(function(e){ bad(e.message); });
}
// ---- Mô phỏng "nếu…" (AI hiểu câu mô tả, app tính dòng tiền, AI diễn giải) ----
var SIM = { text: '', busy: false, res: null };
var SIM_EG = ['Nếu tôi nghỉ việc 6 tháng, tiền không kỳ hạn của tôi chịu được bao lâu?',
  'Nếu tháng sau tôi được tăng lương 20% thì sau 12 tháng tôi có thêm bao nhiêu tiền?',
  'Nếu 3 tháng nữa tôi chi 300 triệu mua xe thì sao?',
  'Nếu tháng sau gửi thêm 200 triệu vào sổ 12 tháng lãi 5,5% thì sao?'];
function simChart(r){
  var W = 760, H = 260, L = 54, R = 14, T = 16, B = 28, pw = W - L - R, ph = H - T - B, n = r.months.length;
  var all = r.base.concat(r.scn), mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
  var hi = mx > 0 ? niceMax(mx * 1.08) : 0, lo = mn < 0 ? -niceMax(-mn * 1.08) : 0;
  if (hi === lo) hi = lo + 1;
  function X(i){ return n > 1 ? L + pw * i / (n - 1) : L + pw / 2; }
  function Y(v){ return T + ph - (v - lo) / (hi - lo) * ph; }
  function path(a){ return a.map(function(v, i){ return (i ? 'L' : 'M') + X(i) + ' ' + Y(v); }).join(''); }
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Tiền khả dụng theo tháng: giữ nguyên so với kịch bản">';
  for (var t = 0; t <= 4; t++){
    var v = lo + (hi - lo) * t / 4, y = Y(v);
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#e5e7eb"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#6b7280">' + trFmt(v) + '</text>';
  }
  if (lo < 0) svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4 3"/>';
  svg += '<path d="' + path(r.base) + '" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" stroke-linejoin="round"/>';
  svg += '<path d="' + path(r.scn) + '" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  var neg = -1; r.scn.forEach(function(v2, i){ if (neg < 0 && v2 < 0) neg = i; });
  if (neg >= 0) svg += '<circle cx="' + X(neg) + '" cy="' + Y(r.scn[neg]) + '" r="5" fill="#dc2626" stroke="#fff" stroke-width="2"/>';
  var every = Math.max(1, Math.ceil(n / 12));
  r.months.forEach(function(m, i){
    if (i % every === 0 || i === n - 1) svg += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="#6b7280">' + esc(m.slice(5) + '/' + m.slice(2, 4)) + '</text>';
    var w = n > 1 ? pw / (n - 1) : pw;
    svg += '<rect x="' + (X(i) - w / 2) + '" y="' + T + '" width="' + w + '" height="' + ph + '" fill="transparent"><title>' + esc(m) + '&#10;Giữ nguyên: ' + vnd(r.base[i]) + '&#10;Kịch bản: ' + vnd(r.scn[i]) + '</title></rect>';
  });
  return '<div class="legend" style="margin:8px 0 4px"><span><i class="dot" style="background:#6b7280"></i> Giữ nguyên như hiện tại</span> <span><i class="dot" style="background:#2563eb"></i> Theo kịch bản</span>' +
    (lo < 0 ? ' <span><i class="dot" style="background:#dc2626"></i> Chạm mức âm</span>' : '') + '</div>' + svg + '</svg>';
}
function drawSim(){
  var box = $('simBox'); if (!box) return;
  var ready = !!(S && S.aiReady), R = SIM.res;
  var h = '<h3>Mô phỏng "nếu…" (AI)</h3>' +
    '<div class="sub" style="margin-bottom:10px">Mô tả một tình huống bằng lời. AI chuyển thành các giả định, app tự tính lại dòng tiền (lương, lãi, đáo hạn, chi tiêu) cho tiền khả dụng, rồi AI diễn giải. Con số do app tính, AI không tự bịa số.</div>';
  if (!ready) h += '<div class="note">Chưa cấu hình khóa API nên chưa dùng được. Xem mục "Phân tích bằng AI" trong README.</div>';
  if (!R && ready) h += '<div class="chips">' + SIM_EG.map(function(q, i){ return '<button type="button" data-sq="' + i + '">' + esc(q) + '</button>'; }).join('') + '</div>';
  h += '<div class="chatform"><textarea id="simIn" rows="2" maxlength="600" placeholder="VD: nếu tôi nghỉ việc 6 tháng... (Enter để chạy, Shift+Enter xuống dòng)"' + (ready ? '' : ' disabled') + '>' + esc(SIM.text) + '</textarea>' +
    '<button class="btn" id="simGo" type="button"' + (ready && !SIM.busy ? '' : ' disabled') + '>' + (SIM.busy ? 'Đang tính...' : 'Mô phỏng') + '</button></div>';
  if (SIM.busy) h += '<div class="chat"><div class="msg a typing"><span class="sub">Đang hiểu kịch bản và tính toán<span class="dots"></span></span></div></div>';
  if (R && !SIM.busy){
    var st = R.result.stats, d = st.diffEnd;
    h += '<div style="margin-top:14px"><div class="sub" style="margin-bottom:6px">Kịch bản: <b>' + esc(R.question) + '</b></div>' +
      '<div class="sc-stats">' +
      '<div><div class="sub">Tiền khả dụng hiện tại</div><div class="v">' + vnd(st.startCash) + '</div></div>' +
      '<div><div class="sub">Cuối kỳ, giữ nguyên (' + esc(R.result.months[R.result.months.length - 1]) + ')</div><div class="v">' + vnd(st.endBase) + '</div></div>' +
      '<div><div class="sub">Cuối kỳ, theo kịch bản</div><div class="v ' + cls(st.endScn) + '">' + vnd(st.endScn) + '</div><div class="sub ' + cls(d) + '">' + (d >= 0 ? '+' : '-') + vnd(Math.abs(d)) + ' so với giữ nguyên</div></div>' +
      '<div><div class="sub">Thấp nhất theo kịch bản</div><div class="v ' + cls(st.minScn.value) + '">' + vnd(st.minScn.value) + '</div><div class="sub">tháng ' + esc(st.minScn.month) + '</div></div></div>';
    if (st.firstNegScn) h += '<div class="note" style="background:#fef2f2;border-color:#fecaca;color:#7f1d1d">Theo kịch bản này, tiền khả dụng chạm mức âm từ tháng <b>' + esc(st.firstNegScn) + '</b>' + (st.firstNegBase ? '' : ' (trong khi nếu giữ nguyên thì không)') + '.</div>';
    h += simChart(R.result);
    h += '<div class="aitext" style="margin-top:12px">' + mdLite(R.text) + '</div>' +
      '<details style="margin-top:10px"><summary class="sub" style="cursor:pointer">Giả định đã dùng (kiểm tra AI có hiểu đúng ý bạn không)</summary><ul class="aitext">' +
      R.assumptions.map(function(a){ return '<li><b>' + esc(a) + '</b></li>'; }).join('') + R.result.assumptions.map(function(a){ return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></details>' +
      '<div class="sub" style="margin-top:8px">Mô phỏng ' + esc(R.provider) + ' / ' + esc(R.model) + '. Chỉ mang tính tham khảo, không phải tư vấn tài chính chuyên nghiệp.</div></div>';
  }
  box.innerHTML = h;
  var inp = $('simIn');
  inp.oninput = function(){ SIM.text = inp.value; };
  inp.onkeydown = function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229){ e.preventDefault(); runSim(); } };
  $('simGo').onclick = function(){ runSim(); };
  [].forEach.call(box.querySelectorAll('[data-sq]'), function(b){ b.onclick = function(){ SIM.text = SIM_EG[Number(b.getAttribute('data-sq'))]; runSim(); }; });
}
function runSim(){
  var text = String(SIM.text || '').trim();
  if (!text || SIM.busy || !(S && S.aiReady)) return;
  if (text.length > 600){ bad('Mô tả quá dài (tối đa 600 ký tự)'); return; }
  SIM.busy = true; drawSim();
  call('aiSimulate', {text: text}).then(function(r){
    r.question = text; SIM.res = r;
  }).catch(function(e){ bad(e.message); }).then(function(){ SIM.busy = false; drawSim(); });
}

function demandSub(d){
  var a = d.demandAccounts || [];
  if (!a.length) return 'Chưa có tài khoản - thêm ở tab Tiết kiệm';
  var oldest = 0; a.forEach(function(x){ var n = daysAgo(x.updated); if (n !== null && n > oldest) oldest = n; });
  return a.length + ' tài khoản · ' + (oldest > 30 ? '<span class="warn">số dư cũ nhất cập nhật ' + oldest + ' ngày trước</span>' : (oldest <= 0 ? 'cập nhật hôm nay' : 'cập nhật cũ nhất ' + oldest + ' ngày trước'));
}
function rDash(){
  var d = S.dashboard, tot = d.totalAssets || 1;
  var colors = {DEMAND:'#60a5fa', TERM_END:'#2563eb', TERM_MONTHLY:'#1e3a8a', INV:'#16a34a'};
  var parts = [['Tiết kiệm không kỳ hạn', d.savingsByType.DEMAND, colors.DEMAND], ['Tiết kiệm lãi cuối kỳ', d.savingsByType.TERM_END, colors.TERM_END],
               ['Tiết kiệm lãi hàng tháng', d.savingsByType.TERM_MONTHLY, colors.TERM_MONTHLY], ['Đầu tư', d.investValue, colors.INV]];
  var invPct = d.investCost > 0 ? d.investUnrealized / d.investCost * 100 : 0;
  var h = '<div class="dash">' +
    '<div class="card hero span2"><h3>Tổng tài sản</h3><div class="big">' + vnd(d.totalAssets) + '</div><div class="sub">Tiết kiệm + đầu tư (giá trị hiện tại)</div></div>' +
    card('Tiền không kỳ hạn', vnd(d.demandBalance), demandSub(d)) +
    card('Tiết kiệm có kỳ hạn', vnd(d.termValue), 'Gốc ' + vnd(d.termPrincipal) + ' · lãi tạm tính ' + vnd(d.termValue - d.termPrincipal)) +
    runwayCard() +
    '<div class="card span2"><h3>Đầu tư</h3><div class="invrow"><div><div class="big">' + vnd(d.investValue) + '</div><div class="sub">Vốn ' + vnd(d.investCost) + '</div></div>' +
    '<div class="invstats"><div><div class="sub">Lãi/lỗ chưa chốt</div><div class="mid ' + cls(d.investUnrealized) + '">' + (d.investUnrealized >= 0 ? '+' : '') + vnd(d.investUnrealized) + ' <span class="sub">(' + (invPct >= 0 ? '+' : '') + pct(invPct) + ')</span></div></div>' +
    '<div><div class="sub">Lãi/lỗ đã chốt</div><div class="mid ' + cls(d.investRealized) + '">' + vnd(d.investRealized) + '</div></div></div></div></div>' +
    '</div>';
  h += '<div class="card" style="margin-bottom:16px"><h3>Phân bổ tài sản</h3><div class="stack">' +
    parts.map(function(p){ return '<div style="width:' + (p[1] / tot * 100) + '%;background:' + p[2] + '" title="' + esc(p[0]) + '"></div>'; }).join('') + '</div><div class="legend">' +
    parts.map(function(p){ return '<span><i class="dot" style="background:' + p[2] + '"></i>' + esc(p[0]) + ': ' + vnd(p[1]) + ' (' + (p[1] / tot * 100).toFixed(1) + '%)</span>'; }).join('') + '</div></div>';
  h += '<div class="card" id="aiBox" style="margin-bottom:16px"></div>';
  h += '<div class="card" id="chatBox" style="margin-bottom:16px"></div>';
  h += '<div class="card" id="simBox" style="margin-bottom:16px"></div>';
  h += incomingCard();
  h += '<div class="grid">';
  h += card('Lương lũy kế năm ' + S.today.slice(0,4) + ' (đến tháng ' + S.today.slice(5,7) + ')', vnd(d.ytd.net) + ' net',
    'Gross ' + vnd(d.ytd.gross) + ' · BH ' + vnd(d.ytd.ins) + ' · thuế ' + vnd(d.ytd.tax) +
    (d.yearPlan.future > 0 ? '<br>Dự kiến cả năm (thêm ' + d.yearPlan.future + ' tháng chưa tới): ' + vnd(d.yearPlan.net) + ' net' : ''));
  h += '<div class="card"><h3>Lương 12 tháng gần nhất</h3>';
  if (!d.salarySeries.length) h += '<div class="sub">Chưa có dữ liệu lương.</div>';
  else {
    var mx = Math.max.apply(null, d.salarySeries.map(function(s){ return s.net + s.tax + s.ins; })) || 1;
    h += '<div class="bars">' + d.salarySeries.map(function(s){
      var H = function(v){ return (v / mx * 100) + '%'; };
      return '<div class="b"><div class="col" style="height:100%;justify-content:flex-end"><div style="height:' + H(s.tax) + ';background:#dc2626" title="Thuế ' + vnd(s.tax) + '"></div><div style="height:' + H(s.ins) + ';background:#f59e0b" title="BH ' + vnd(s.ins) + '"></div><div style="height:' + H(s.net) + ';background:#16a34a" title="Net ' + vnd(s.net) + '"></div></div>' + esc(s.month.slice(5)) + '</div>';
    }).join('') + '</div><div class="legend"><span><i class="dot" style="background:#16a34a"></i>Net</span><span><i class="dot" style="background:#f59e0b"></i>Bảo hiểm</span><span><i class="dot" style="background:#dc2626"></i>Thuế</span></div>';
  }
  h += '</div></div>';
  $('t-dash').innerHTML = h;
  drawAi();
  drawChat();
  drawSim();
  drawIncoming();
}
// Ô gộp: tiền sắp nhận (lương net + lãi tiết kiệm sau thuế + gốc hoàn lại khi đáo hạn)
// Người dùng chọn: trong vòng N ngày, hoặc đến hết một ngày cụ thể. Server gửi sẵn các khoản trong 365 ngày, lọc ở trình duyệt.
var INC = {mode: 'days', days: 30, date: ''};
function isoPlus(n){ return new Date(Date.parse(S.today) + n * 86400000).toISOString().slice(0, 10); }
function incLimit(){
  var max = S.dashboard.incoming.horizon, n;
  if (INC.mode === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(INC.date)) n = Math.round((Date.parse(INC.date) - Date.parse(S.today)) / 86400000);
  else n = Number(INC.days);
  if (isNaN(n)) n = 60;
  return Math.max(0, Math.min(max, Math.floor(n)));
}
function incomingCard(){
  return '<div class="card" style="margin-bottom:16px" id="incBox"></div>';
}
function drawIncoming(){
  var box = $('incBox'); if (!box) return;
  var inc = S.dashboard.incoming, max = inc.horizon;
  var h = '<div class="row" style="margin:0 0 8px"><h3 id="incTitle" style="margin:0"></h3><div class="seg">' +
    '<button type="button" data-im="days" class="' + (INC.mode === 'days' ? 'on' : '') + '">Trong vòng … ngày</button>' +
    '<button type="button" data-im="date" class="' + (INC.mode === 'date' ? 'on' : '') + '">Đến ngày cụ thể</button></div></div>';
  h += '<div class="pl" style="margin:0 0 6px">';
  if (INC.mode === 'date')
    h += '<div style="flex:0 1 220px"><label>Nhận từ hôm nay đến hết ngày</label><input type="date" id="incDate" min="' + esc(S.today) + '" max="' + esc(isoPlus(max)) + '" value="' + esc(INC.date) + '"></div>';
  else
    h += '<div style="flex:0 1 160px"><label>Số ngày tới (1-' + max + ')</label><input type="number" id="incDays" min="1" max="' + max + '" step="1" value="' + esc(INC.days) + '"></div>' +
      '<div style="flex:1 1 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px">' + [30, 60, 90, 180, 365].map(function(d){
        return '<button type="button" class="btn ghost" data-id="' + d + '" style="padding:6px 10px">' + d + ' ngày</button>'; }).join('') + '</div>';
  h += '</div><div id="incBody"></div>';
  box.innerHTML = h;
  [].forEach.call(box.querySelectorAll('[data-im]'), function(b){
    b.onclick = function(){
      var m = b.getAttribute('data-im'); if (m === INC.mode) return;
      INC.mode = m;
      if (m === 'date' && !/^\d{4}-\d{2}-\d{2}$/.test(INC.date)) INC.date = isoPlus(incLimit());
      if (m === 'days') INC.days = Math.max(1, incLimit());
      drawIncoming();
    };
  });
  [].forEach.call(box.querySelectorAll('[data-id]'), function(b){
    b.onclick = function(){ INC.days = Number(b.getAttribute('data-id')); $('incDays').value = INC.days; drawIncomingBody(); };
  });
  var di = $('incDays'); if (di) di.oninput = function(){ INC.days = this.value; drawIncomingBody(); };
  var dd = $('incDate'); if (dd) dd.onchange = function(){ INC.date = this.value; drawIncomingBody(); };
  drawIncomingBody();
}
function drawIncomingBody(){
  var box = $('incBody'); if (!box) return;
  var inc = S.dashboard.incoming, n = incLimit(), until = isoPlus(n);
  var ev = inc.events.filter(function(e){ return e.days <= n; });
  var title = INC.mode === 'date' && /^\d{4}-\d{2}-\d{2}$/.test(INC.date) ? 'Tiền sắp nhận đến hết ngày ' + INC.date : 'Tiền sắp nhận trong ' + n + ' ngày tới';
  $('incTitle').textContent = title;
  if (!ev.length){ box.innerHTML = '<div class="sub">Không có khoản nào sắp nhận trong khoảng này (cần có sổ có kỳ hạn hoặc dữ liệu lương).</div>'; return; }
  var T = {salary: 0, interest: 0, principal: 0};
  ev.forEach(function(e){ if (e.kind === 'salary') T.salary += e.net; else { T.interest += e.interest; T.principal += e.principal; } });
  var all = T.salary + T.interest + T.principal;
  var h = '<div class="big">' + vnd(all) + '</div><div class="sub">Từ hôm nay đến ' + esc(until) + ' (' + n + ' ngày) · ' + ev.length + ' khoản</div>' +
    '<div class="sc-stats" style="margin:12px 0">' +
    '<div><div class="sub">Lương net</div><div class="v">' + vnd(T.salary) + '</div></div>' +
    '<div><div class="sub">Lãi tiết kiệm (sau thuế ' + num(inc.taxRate) + '%)</div><div class="v">' + vnd(T.interest) + '</div></div>' +
    '<div><div class="sub">Gốc hoàn lại khi đáo hạn</div><div class="v">' + vnd(T.principal) + '</div></div></div>';
  // Gom các khoản trùng ngày thành một hàng; bấm vào hàng để xem chi tiết từng khoản
  var groups = [], byDate = {};
  ev.forEach(function(e){
    if (!byDate[e.date]){ byDate[e.date] = {date: e.date, days: e.days, items: [], amt: 0}; groups.push(byDate[e.date]); }
    var g = byDate[e.date];
    g.items.push(e);
    g.amt += e.kind === 'salary' ? e.net : e.principal + e.interest;
  });
  function itemLabel(e){
    if (e.kind === 'salary') return 'Lương tháng ' + esc(e.month) + ' (net)' + (e.estimated ? ' <span class="badge o" title="Chưa nhập lương tháng này, ước tính theo lương tháng gần nhất không gồm thưởng">ước tính</span>' : '');
    if (e.kind === 'maturity') return esc(e.name) + ' <span class="sub">đáo hạn: gốc ' + vnd(e.principal) + ' + lãi ' + vnd(e.interest) + '</span>';
    return esc(e.name) + ' <span class="sub">lãi</span>';
  }
  function itemAmt(e){ return e.kind === 'salary' ? e.net : e.principal + e.interest; }
  h += groups.map(function(g){
    var when = g.days === 0 ? 'hôm nay' : 'còn ' + g.days + ' ngày';
    var head = '<b>' + esc(g.date) + '</b> <span class="sub">' + when + '</span> · ';
    if (g.items.length === 1)
      return '<div class="kv"><span>' + head + itemLabel(g.items[0]) + '</span><span>' + vnd(g.amt) + '</span></div>';
    var sal = g.items.filter(function(e){ return e.kind === 'salary'; }), itr = g.items.filter(function(e){ return e.kind === 'interest'; }), mat = g.items.filter(function(e){ return e.kind === 'maturity'; });
    var parts = [];
    if (sal.length) parts.push('Lương tháng ' + esc(sal[0].month) + ' (net)' + (sal[0].estimated ? ' <span class="badge o">ước tính</span>' : ''));
    if (itr.length) parts.push('Lãi ' + itr.length + ' sổ');
    if (mat.length) parts.push('Đáo hạn ' + mat.length + ' sổ (gốc + lãi)');
    return '<details class="incd"><summary class="kv"><span><span class="car">▸</span> ' + head + parts.join(' + ') + ' <span class="sub">(' + g.items.length + ' khoản)</span></span><span>' + vnd(g.amt) + '</span></summary>' +
      '<div class="incs">' + g.items.map(function(e){ return '<div class="kv"><span>' + itemLabel(e) + '</span><span>' + vnd(itemAmt(e)) + '</span></div>'; }).join('') + '</div></details>';
  }).join('');
  box.innerHTML = h + '<div class="sub" style="margin-top:8px">Lãi tiết kiệm đã trừ thuế khấu trừ, gốc không bị trừ. Lương nhận vào ngày cuối tháng (rơi vào thứ 7 / chủ nhật thì lùi về thứ 6, chưa xét ngày lễ). Xem được tối đa ' + inc.horizon + ' ngày.</div>';
}
function card(t, big, sub){ return '<div class="card"><h3>' + t + '</h3><div class="big">' + big + '</div><div class="sub">' + sub + '</div></div>'; }
function acts(ent, key){ return '<button class="lnk" data-act="edit" data-ent="' + ent + '" data-key="' + esc(key) + '">Sửa</button><button class="lnk del" data-act="del" data-ent="' + ent + '" data-key="' + esc(key) + '">Xóa</button>'; }

// Trạng thái sắp xếp / lọc của trang Tiết kiệm (giữ nguyên khi dữ liệu tải lại)

// Thanh phân trang dùng chung: cur = trang hiện tại, total = tổng số trang
function pagerHtml(cur, total, attr){
  attr = attr || 'data-pg';
  if (total <= 1) return '';
  var pages = [], i;
  for (i = 1; i <= total; i++) if (i === 1 || i === total || Math.abs(i - cur) <= 1) pages.push(i);
  var h = '<div class="pager"><button type="button" ' + attr + '="' + (cur - 1) + '"' + (cur <= 1 ? ' disabled' : '') + '>‹ Trước</button>';
  var prev = 0;
  pages.forEach(function(p){
    if (prev && p - prev > 1) h += '<span class="gap">…</span>';
    h += '<button type="button" ' + attr + '="' + p + '"' + (p === cur ? ' class="on"' : '') + '>' + p + '</button>';
    prev = p;
  });
  return h + '<button type="button" ' + attr + '="' + (cur + 1) + '"' + (cur >= total ? ' disabled' : '') + '>Sau ›</button></div>';
}
var SAV_COLS = [

  {k:'startDate', l:'Ngày gửi'}, {k:'maturityDate', l:'Đáo hạn'}, {k:'accrued', l:'Lãi đã tích lũy', n:1},

var SAV_EXTRA_SORT = [{k:'nextPayout', l:'Kỳ trả lãi tới (gần nhất)'}];
function savStatus(s){ return s.status === 'closed' ? 'closed' : (s.calc.matured ? 'matured' : 'active'); }
function savSortVal(s, k){
  var c = s.calc;
  switch (k){
    case 'name': return String(s.name || '').toLowerCase();
    case 'type': return ({DEMAND:0, TERM_END:1, TERM_MONTHLY:2})[s.type];
    case 'principal': return Number(s.principal);
    case 'rate': return Number(s.rate);
    case 'startDate': return String(s.startDate || '');
    case 'maturityDate': return c.maturityDate || null;
    case 'accrued': return s.status === 'closed' ? null : c.accrued;
    case 'interestMid': return s.type === 'TERM_END' ? c.totalInterest : (s.type === 'TERM_MONTHLY' ? c.monthlyInterest : null);
    case 'received': return s.type === 'TERM_MONTHLY' ? c.received : null;
    case 'nextPayout': return s.status === 'closed' ? null : (c.nextPayout || null);

}
function termSavings(){ return S.savings.filter(function(s){ return s.type !== 'DEMAND'; }); }
function savView(){
  var q = SAVV.q.trim().toLowerCase();
  var list = termSavings().filter(function(s){
    if (SAVV.type && s.type !== SAVV.type) return false;
    if (SAVV.status && savStatus(s) !== SAVV.status) return false;
    if (q && (String(s.name || '') + ' ' + String(s.note || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  if (SAVV.sort){
    var dir = SAVV.dir === 'desc' ? -1 : 1;
    list = list.map(function(s, i){ return {s: s, i: i, v: savSortVal(s, SAVV.sort)}; }).sort(function(a, b){
      var an = a.v === null || a.v === undefined, bn = b.v === null || b.v === undefined;
      if (an || bn) return an && bn ? a.i - b.i : (an ? 1 : -1);   // ô trống luôn xếp cuối
      if (a.v < b.v) return -dir; if (a.v > b.v) return dir;
      return a.i - b.i;
    }).map(function(x){ return x.s; });
  }
  return list;
}

       (act.length ? ' · gốc đang gửi ' + vnd(sumP) + ' · lãi tích lũy ' + vnd(sumA) : '') + '</div>';

  var ss = $('savSort'); if (ss) ss.value = SAVV.sort;

function daysAgo(d){ var a = Date.parse(S.today), b = Date.parse(d); return isNaN(a) || isNaN(b) ? null : Math.round((a - b) / 86400000); }
// Tiền không kỳ hạn: chỉ lưu số dư hiện tại (cập nhật tay), không tính lãi vào số dư

// Chi tiêu ước tính hàng tháng, đối chiếu với tổng số dư tiền không kỳ hạn
var EXP_TARGET_MONTHS = 6;
// ---------- Chi tiêu: ngân sách (ChiTieu) so với thực chi (ThucChi) ----------
function shiftMonth(m, n){ var y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) - 1 + n; var d = new Date(Date.UTC(y, mo, 1)); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2); }
function lowName(x){ return String(x || '').trim().toLowerCase(); }
// Ngân sách hiệu lực của từng khoản trong một tháng: dòng có "từ tháng" muộn hơn thì thắng
function budgetMap(month){
  var out = {}, order = [];
  (S.expenses || []).filter(function(x){ return x.status !== 'paused' && (!x.from || String(x.from) <= month) && (!x.to || month <= String(x.to)); })
    .sort(function(a, b){ return String(a.from || '').localeCompare(String(b.from || '')); })
    .forEach(function(x){ var k = lowName(x.name); if (!(k in out)) order.push(k); out[k] = {name: String(x.name).trim(), amount: Number(x.amount) || 0}; });
  return {map: out, order: order};
}
function spendRec(month, name){
  return (S.spends || []).filter(function(r){ return r.month === month && lowName(r.name) === lowName(name); })[0] || null;
}
// Danh sách khoản chi của một tháng: có ngân sách trước, rồi các khoản có thực chi nhưng không có ngân sách
function monthRows(month){
  var b = budgetMap(month), rows = [], seen = {};
  b.order.forEach(function(k){ seen[k] = 1; var r = spendRec(month, b.map[k].name); rows.push({name: b.map[k].name, budget: b.map[k].amount, rec: r, actual: r ? Number(r.amount) || 0 : null}); });
  (S.spends || []).filter(function(r){ return r.month === month && !seen[lowName(r.name)]; }).forEach(function(r){ seen[lowName(r.name)] = 1; rows.push({name: String(r.name), budget: 0, rec: r, actual: Number(r.amount) || 0, noBudget: true}); });
  return rows;
}
function spColor(p){ return p > 100 ? '#dc2626' : p >= 90 ? '#d97706' : '#16a34a'; }
function spLabel(p){ return p > 100 ? 'Vượt' : p >= 90 ? 'Gần hết' : 'Trong mức'; }
function monthTotals(month){
  var rows = monthRows(month), b = 0, a = 0, any = false;
  rows.forEach(function(r){ b += r.budget; if (r.actual != null) { a += r.actual; any = true; } });
  return {budget: b, actual: a, any: any, rows: rows};
}
function expSummary(demandList){
  var cur = S.today.slice(0, 7), bt = monthTotals(cur).budget;
  var tot = 0, n = 0;
  for (var i = 1; i <= 3; i++){ var t = monthTotals(shiftMonth(cur, -i)); if (t.any){ tot += t.actual; n++; } }
  var avg = n ? tot / n : 0, basis = n && avg > 0 ? avg : bt;
  var bal = demandList.reduce(function(a, s){ return a + (Number(s.principal) || 0); }, 0);

}
function expBasisText(E){
  return E.avgN ? 'theo thực chi trung bình ' + E.avgN + ' tháng gần nhất (' + vnd(E.avgActual) + ')' : 'theo ngân sách tháng này';

// Phần trong tab Tiết kiệm: tiền không kỳ hạn đủ chi trả bao lâu

// Ô trên Tổng quan: tiền không kỳ hạn đủ chi trả + tình hình chi tiêu tháng này

// Màu theo khoản chi (cố định theo tên, không đổi khi lọc năm); quá 6 khoản thì gộp vào "Khác"

// Biểu đồ cột chồng theo khoản chi; mỗi cột {label, full, parts:[{name,value}], budget}; vạch ngang đen = ngân sách

  if (!(mx > 0)){ box.innerHTML = '<div class="empty">Chưa có số thực chi để vẽ biểu đồ.</div>'; if (lg) lg.innerHTML = ''; return; }

  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="Biểu đồ thực chi">';
  for (var t = 0; t <= 4; t++){ var v = top * t / 4, y = Y(v); svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#e5e7eb"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#6b7280">' + trFmt(v) + '</text>'; }
  cols.forEach(function(c, i){

    sorted.forEach(function(p, k){

        : '<rect x="' + x + '" y="' + y0 + '" width="' + bw + '" height="' + hh + '" fill="' + spColorOf(p.name) + '" stroke="#fff" stroke-width="1">' + tip + '</rect>';

    svg += '<rect x="' + (cx - slot / 2) + '" y="' + T0 + '" width="' + slot + '" height="' + ph + '" fill="transparent"><title>' + tt + '</title></rect>';
  });
  box.innerHTML = svg + '</svg>';
  if (lg) lg.innerHTML = '<div class="legend" style="margin-bottom:6px">' + order.filter(function(nm){ return used[lowName(nm)]; }).map(function(nm){
      return '<span><i class="dot" style="background:' + spColorOf(nm) + '"></i> ' + esc(nm) + '</span>'; }).join(' ') +
    (hasBudget ? ' <span><i style="display:inline-block;width:14px;height:0;border-top:2px solid #111827;vertical-align:middle;margin-right:4px"></i> Ngân sách tháng</span>' : '') + '</div>';
}

function spendRowDyn(r, i){
  var p = r.budget > 0 && r.actual != null ? r.actual / r.budget * 100 : null;
  var diff = r.actual == null ? null : r.budget - r.actual;
  return {
    diff: diff == null ? '—' : (diff >= 0 ? 'còn ' : 'vượt ') + vnd(Math.abs(diff)),
    diffCls: diff == null ? 'sub' : diff >= 0 ? 'pos' : 'neg',
    bar: p == null ? '' : '<div class="pbar"><i style="width:' + Math.min(100, p) + '%;background:' + spColor(p) + '"></i></div><div class="sub">' + spLabel(p) + ' · ' + p.toFixed(0) + '%</div>'
  };
}
function spendTotalsHtml(T){
  var p = T.budget > 0 ? T.actual / T.budget * 100 : 0, left = T.budget - T.actual;
  return '<div class="card"><h3>Ngân sách tháng</h3><div class="big">' + vnd(T.budget) + '</div></div>' +
    '<div class="card"><h3>Thực chi</h3><div class="big">' + vnd(T.actual) + '</div><div class="sub">' + (T.budget > 0 && T.any ? p.toFixed(0) + '% ngân sách' : 'Chưa nhập') + '</div></div>' +
    '<div class="card"><h3>' + (left >= 0 ? 'Còn lại' : 'Vượt ngân sách') + '</h3><div class="big ' + (T.any ? (left >= 0 ? 'pos' : 'neg') : '') + '">' + (T.any ? vnd(Math.abs(left)) : '—') + '</div></div>';
}

function saveSpend(row, inp, i){
  var raw = String(inp.value).trim();
  if (raw === ''){
    if (!row.rec) return;
    inp.disabled = true;
    return call('remove', {entity: 'spend', key: row.rec.id}).then(function(){
      S.spends = S.spends.filter(function(r){ return r.id !== row.rec.id; });
      ok('Đã bỏ số thực chi'); afterSpendChange();
    }).catch(function(e){ inp.disabled = false; bad(e.message); });
  }
  var v = Number(raw);
  if (isNaN(v) || v < 0){ bad('Số tiền không hợp lệ'); inp.value = row.actual == null ? '' : row.actual; return; }
  if (row.actual === v) return;
  inp.disabled = true;
  call('save', {entity: 'spend', record: {id: row.rec ? row.rec.id : '', month: spMonth, name: row.name, amount: v, note: row.rec ? row.rec.note : ''}}).then(function(rec){
    var k = S.spends.findIndex(function(r){ return r.id === rec.id; });
    if (k >= 0) S.spends[k] = rec; else S.spends.push(rec);
    ok('Đã lưu thực chi ' + row.name); afterSpendChange();
  }).catch(function(e){ inp.disabled = false; bad(e.message); });
}

function openBalance(id){
  var s = S.savings.filter(function(x){ return String(x.id) === String(id); })[0];
  if (!s){ bad('Không tìm thấy tài khoản này, hãy tải lại trang'); return; }
  var cur = Number(s.principal) || 0;
  $('dlgBody').innerHTML = '<h2>Cập nhật số dư - ' + esc(s.name) + '</h2><form id="bf">' +
    '<div class="kv"><span>Số dư hiện tại</span><b>' + vnd(cur) + '</b></div>' +
    '<label>Số dư mới (₫)</label><input id="bnew" type="number" step="any" min="0" placeholder="Nhập số dư thực tế">' +
    '<label>Hoặc số tiền nạp / rút (₫): số dương = nạp thêm, số âm = rút ra</label><input id="bdelta" type="number" step="any" placeholder="VD: 2000000 hoặc -500000">' +
    '<div class="sub" id="bprev" style="margin-top:8px;min-height:16px"></div><div class="err" id="berr"></div>' +
    '<div class="acts"><button type="button" class="btn ghost" id="bc">Hủy</button><button type="submit" class="btn" id="bsave">Lưu</button></div></form>';
  function target(){
    var n = $('bnew').value, d = $('bdelta').value;
    if (n !== '') return Number(n);
    if (d !== '') return cur + Number(d);
    return null;
  }
  function prev(){ var t = target(); $('bprev').textContent = (t === null || isNaN(t)) ? '' : 'Số dư sau cập nhật: ' + vnd(t); }
  $('bnew').oninput = function(){ if (this.value !== '') $('bdelta').value = ''; prev(); };
  $('bdelta').oninput = function(){ if (this.value !== '') $('bnew').value = ''; prev(); };
  $('bc').onclick = function(){ $('dlg').close(); };
  $('bf').onsubmit = function(ev){
    ev.preventDefault();
    var t = target(); $('berr').textContent = '';
    if (t === null || isNaN(t)){ $('berr').textContent = 'Nhập số dư mới, hoặc số tiền nạp/rút'; return; }
    if (t < 0){ $('berr').textContent = 'Số dư không thể âm'; return; }
    var rec = JSON.parse(JSON.stringify(s)); delete rec.calc;
    rec.principal = Math.round(t * 100) / 100; rec.startDate = S.today;
    busy([$('bsave'), $('bc')], 'Đang lưu...', call('save', {entity: 'savings', record: rec}).then(function(){ $('dlg').close(); ok('Đã cập nhật số dư'); return load(); }))
      .catch(function(e){ $('berr').textContent = e.message; bad(e.message); });
  };
  $('dlg').showModal();
  $('bnew').focus();
}

// Ô tỷ giá: mỗi ngoại tệ đang nắm giữ một dòng, ưu tiên tỷ giá tự động từ Google Finance
function fxCard(P){
  var by = {};
  P.positions.forEach(function(p){
    if (!p.currency || !p.fxRate) return;
    var o = by[p.currency];
    if (!o || (p.fxSource === 'auto' && o.src !== 'auto')) by[p.currency] = {rate: p.fxRate, src: p.fxSource, upd: p.fxUpdated};
  });
  var ks = Object.keys(by);
  if (!ks.length) return '';
  var body = '', stale = false, upd = '';
  ks.forEach(function(c){
    var o = by[c];
    body += '<div class="big"' + (ks.length > 1 ? ' style="font-size:17px"' : '') + '>1 ' + esc(c) + ' = ' + num(o.rate, 0) + ' ₫' + (o.src === 'auto' ? ' <span class="badge g" title="Tỷ giá tự động từ Google Finance">⚡</span>' : ' <span class="badge o" title="Chưa lấy tỷ giá tự động, đang dùng tỷ giá của lần giao dịch gần nhất">*</span>') + '</div>';
    if (o.src !== 'auto') stale = true; else if (o.upd && o.upd > upd) upd = o.upd;
  });
  return '<div class="card"><h3>Tỷ giá hiện tại</h3>' + body + '<div class="sub">' + (stale ? '* Chưa có tỷ giá tự động, bấm "⚡ Lấy giá tự động". Đang dùng tỷ giá lúc mua.' : 'Google Finance' + (upd ? ', cập nhật ' + esc(upd) : '')) + '</div></div>';
}
function curMoney(v, c){ var d = (c === 'JPY' || c === 'KRW') ? 0 : 2; return num(v, d) + ' ' + esc(c); }
// Ô tiền của vị thế: ngoại tệ là số chính, ₫ quy đổi ghi nhỏ bên dưới
function posMoney(p, nat, vndVal){
  if (p.currency && nat != null) return curMoney(nat, p.currency) + '<div class="sub">≈ ' + vnd(vndVal) + '</div>';
  return vnd(vndVal);
}
function txRate(x){ var c = String(x.currency || '').toUpperCase(); return (c && c !== 'VND') ? (Number(x.fxRate) || 1) : 1; }
// Số tiền của giao dịch: ngoại tệ hiện kèm quy đổi sang ₫
function txMoney(x, v){
  var c = String(x.currency || '').toUpperCase();
  if (!c || c === 'VND') return vnd(v);
  return num(v, 4) + ' ' + esc(c) + '<div class="sub">≈ ' + vnd(v * txRate(x)) + ' (tỷ giá ' + num(x.fxRate, 2) + ')</div>';
}

// Trang Lương & Thuế: mỗi trang là một năm
var SALV = { year: '', calcOpen: false };
function drawSalTable(){

    '<button type="button" class="on" data-yr="' + SALV.year + '">' + SALV.year + '</button>' +
    '<button type="button" title="Năm sau" data-yr="' + (years[idx + 1] || '') + '"' + (idx >= years.length - 1 ? ' disabled' : '') + '>›</button></div>';
  h += '<div class="scroll"><table><thead><tr><th>Tháng</th><th class="n">Gross</th><th class="n">Bảo hiểm</th><th class="n">Thu nhập tính thuế</th><th class="n">Thuế TNCN</th><th class="n">Net</th><th></th></tr></thead><tbody>';
  var tg = 0, ti = 0, tt = 0, tn = 0;
  rows.forEach(function(s){
    var c = s.calc;
    tg += c.gross || 0; ti += c.insurance || 0; tt += c.tax || 0; tn += c.net || 0;
    h += '<tr><td><b>' + esc(s.month) + '</b></td><td class="n">' + vnd(c.gross) + '</td><td class="n">' + vnd(c.insurance) + '</td><td class="n">' + vnd(c.taxBase) + '</td><td class="n neg">' + vnd(c.tax) + '</td><td class="n pos"><b>' + vnd(c.net) + '</b></td><td><button class="lnk" data-act="detail" data-key="' + esc(s.id) + '">Chi tiết</button>' + acts('salary', s.id) + '</td></tr>';
  });
  h += '</tbody></table></div><div class="sub" style="margin-top:8px">Năm ' + esc(SALV.year) + ': ' + rows.length + ' tháng · gross ' + vnd(tg) + ' · bảo hiểm ' + vnd(ti) + ' · thuế TNCN ' + vnd(tt) + ' · net ' + vnd(tn) + '</div>';
  box.innerHTML = h;
}

// ---- Biểu đồ lương: theo dõi các lần tăng lương gross (không tính thưởng) ----
function salaryRaises(rows){
  // rows: tăng dần theo tháng, mỗi dòng {month, fixed}
  var out = [];
  for (var i = 1; i < rows.length; i++){
    var d = rows[i].fixed - rows[i - 1].fixed;
    if (d > 0.5) out.push({month: rows[i].month, from: rows[i - 1].fixed, to: rows[i].fixed, diff: d, pct: rows[i - 1].fixed > 0 ? d / rows[i - 1].fixed : null, i: i});
  }
  return out;
}
function salChartRows(){
  var cur = S.today.slice(0, 7);
  return S.salary.filter(function(x){ return String(x.month) <= cur && x.calc; }).map(function(x){
    var g = Number(x.calc.gross) || 0, b = Number(x.bonus) || 0;
    return {month: String(x.month), gross: g, bonus: b, fixed: g - b};
  }).sort(function(a, b){ return a.month < b.month ? -1 : a.month > b.month ? 1 : 0; });
}
function niceMax(v){
  if (!(v > 0)) return 1;
  var e = Math.pow(10, Math.floor(Math.log(v) / Math.LN10)), f = v / e;
  var n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return n * e;
}
function trFmt(v){ var m = v / 1e6; return (Math.round(m * 10) / 10).toString().replace('.', ',') + ' tr'; }
function drawSalChart(){
  var box = $('salChart'); if (!box) return;
  var rows = salChartRows();
  if (rows.length < 1){ box.innerHTML = '<div class="empty">Chưa có dữ liệu lương để vẽ biểu đồ.</div>'; return; }
  var raises = salaryRaises(rows);
  var first = rows[0], last = rows[rows.length - 1];
  var since = first.fixed > 0 ? (last.fixed - first.fixed) / first.fixed : null;
  var lastR = raises.length ? raises[raises.length - 1] : null;

  var h = '<div class="sc-stats">' +
    '<div><div class="sub">Gross cố định hiện tại</div><div class="v">' + vnd(last.fixed) + '</div></div>' +
    '<div><div class="sub">Tăng từ ' + esc(first.month) + '</div><div class="v ' + (since > 0 ? 'pos' : '') + '">' + (since == null ? '—' : (since > 0 ? '+' : '') + (since * 100).toFixed(1).replace('.', ',') + '%') + '</div></div>' +
    '<div><div class="sub">Số lần tăng lương</div><div class="v">' + raises.length + '</div></div>' +
    '<div><div class="sub">Lần tăng gần nhất</div><div class="v">' + (lastR ? esc(lastR.month) : '—') + '</div></div></div>';

  // hình học
  var W = 760, H = 280, L = 44, R = 12, T = 22, B = 30, pw = W - L - R, ph = H - T - B;
  var maxV = 0; rows.forEach(function(r){ if (r.gross > maxV) maxV = r.gross; });
  var top = niceMax(maxV * 1.08), n = rows.length, slot = pw / n, bw = Math.min(24, slot * 0.62);
  function X(i){ return L + slot * (i + 0.5); }
  function Y(v){ return T + ph - (v / top) * ph; }
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Biểu đồ lương gross theo tháng, đánh dấu các lần tăng lương">';
  var ticks = 4;
  for (var t = 0; t <= ticks; t++){
    var v = top * t / ticks, y = Y(v);
    svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="#e5e7eb" stroke-width="1"/>' +
      '<text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="#6b7280">' + trFmt(v) + '</text>';
  }
  // cột: tổng gross (có thưởng) - nhạt
  rows.forEach(function(r, i){
    var y = Y(r.gross), hh = T + ph - y, x = X(i) - bw / 2, rad = Math.min(4, bw / 2, hh);
    if (hh <= 0) return;
    svg += '<path d="M' + x + ' ' + (T + ph) + 'V' + (y + rad) + 'Q' + x + ' ' + y + ' ' + (x + rad) + ' ' + y + 'H' + (x + bw - rad) + 'Q' + (x + bw) + ' ' + y + ' ' + (x + bw) + ' ' + (y + rad) + 'V' + (T + ph) + 'Z" fill="#bfd3f5"/>';
  });
  // đường bậc thang: gross cố định
  var d = '';
  rows.forEach(function(r, i){
    var x = X(i), y = Y(r.fixed);
    d += (i === 0 ? 'M' + x + ' ' + y : 'H' + x + 'V' + y);
  });
  svg += '<path d="' + d + '" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  // nhãn trục X thưa
  var every = Math.max(1, Math.ceil(n / 12));
  rows.forEach(function(r, i){
    if (i % every === 0 || i === n - 1) {
      if (i !== n - 1 && n - 1 - i < every * 0.6) return;
      svg += '<text x="' + X(i) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#6b7280">' + esc(r.month.slice(2)) + '</text>';
    }
  });
  // mốc tăng lương
  raises.forEach(function(rz){
    var x = X(rz.i), y = Y(rz.to);
    svg += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="#16a34a" stroke="#fff" stroke-width="2"/>' +
      '<text x="' + x + '" y="' + Math.max(12, y - 11) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#1f2937">' + (rz.pct == null ? '' : '+' + (rz.pct * 100).toFixed(0) + '%') + '</text>';
  });
  // vùng hover theo từng tháng (rộng ≥ 24px)
  rows.forEach(function(r, i){
    svg += '<rect class="sc-hit" data-i="' + i + '" x="' + (X(i) - Math.max(12, slot / 2)) + '" y="' + T + '" width="' + Math.max(24, slot) + '" height="' + ph + '" tabindex="0"/>';
  });
  svg += '</svg>';

  h += '<div class="legend" style="margin-bottom:6px"><span><i class="dot" style="background:#bfd3f5"></i> Tổng gross tháng (gồm thưởng)</span> ' +
    '<span><i class="dot" style="background:#2563eb"></i> Gross cố định (không thưởng)</span> ' +
    '<span><i class="dot" style="background:#16a34a"></i> Lần tăng lương</span></div>' +
    '<div class="sc-wrap">' + svg + '<div class="sc-tip" id="scTip"></div></div>';

  // bảng các lần tăng
  h += '<h3 style="margin:16px 0 8px">Các lần tăng lương</h3>';
  if (!raises.length) h += '<div class="sub">Chưa có lần tăng nào trong dữ liệu (so sánh gross không gồm thưởng giữa các tháng liên tiếp).</div>';
  else {
    h += '<div class="scroll"><table><thead><tr><th>Từ tháng</th><th class="n">Trước</th><th class="n">Sau</th><th class="n">Tăng thêm</th><th class="n">%</th></tr></thead><tbody>';
    raises.slice().reverse().forEach(function(rz){
      h += '<tr><td><b>' + esc(rz.month) + '</b></td><td class="n">' + vnd(rz.from) + '</td><td class="n">' + vnd(rz.to) + '</td><td class="n pos">+' + vnd(rz.diff) + '</td><td class="n pos">' + (rz.pct == null ? '—' : '+' + (rz.pct * 100).toFixed(1).replace('.', ',') + '%') + '</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="sub" style="margin-top:8px">Lần tăng = gross không gồm thưởng của tháng cao hơn tháng liền trước, nên tháng có thưởng không bị tính nhầm là tăng lương. Chỉ hiển thị đến tháng hiện tại.</div>';
  box.innerHTML = h;

  var tip = $('scTip'), wrap = box.querySelector('.sc-wrap');
  function show(i, ev){
    var r = rows[i], rz = raises.filter(function(x){ return x.i === i; })[0];
    tip.textContent = '';
    function line(txt, strong){ var e = document.createElement(strong ? 'b' : 'div'); e.textContent = txt; tip.appendChild(e); if (strong) tip.appendChild(document.createElement('br')); }
    line(vnd(r.fixed), true);
    line('Gross cố định · ' + r.month);
    if (r.bonus) line('Thưởng ' + vnd(r.bonus) + ' → tổng ' + vnd(r.gross));
    if (rz) line('Tăng ' + vnd(rz.diff) + (rz.pct == null ? '' : ' (+' + (rz.pct * 100).toFixed(1).replace('.', ',') + '%)'));
    tip.style.display = 'block';
    var wr = wrap.getBoundingClientRect(), tr = ev.target.getBoundingClientRect();
    var cx = tr.left + tr.width / 2 - wr.left, tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(wr.width - tw, cx - tw / 2)) + 'px';
    tip.style.top = Math.round(wr.height * 0.58) + 'px';
  }
  function hide(){ tip.style.display = 'none'; }
  box.querySelectorAll('.sc-hit').forEach(function(el){
    var i = Number(el.getAttribute('data-i'));
    el.addEventListener('pointerenter', function(e){ show(i, e); });
    el.addEventListener('pointermove', function(e){ show(i, e); });
    el.addEventListener('focus', function(e){ show(i, e); });
    el.addEventListener('pointerleave', hide);
    el.addEventListener('blur', hide);
  });
}
function rSal(){
  var h = '<div class="note">Tính thuế TNCN từ tiền lương theo biểu lũy tiến 5 bậc (5% / 10% / 20% / 30% / 35%) và mức giảm trừ gia cảnh áp dụng từ kỳ tính thuế 2026. Mọi tham số (giảm trừ, tỷ lệ BH, trần đóng, bậc thuế) chỉnh được ở tab Cài đặt. Ứng dụng chỉ mang tính tham khảo; số liệu quyết toán thực tế theo chứng từ của đơn vị chi trả.</div>';

    '<label>Hoặc lương net mong muốn (₫) → tìm gross</label><input id="qn" type="number" placeholder="VD: 25000000">' +

  }
  $('qbg').onclick = function(){
    var g = Number($('qg').value); $('qe').textContent = '';
    if (!(g > 0)) { $('qe').textContent = 'Nhập lương gross hợp lệ'; toast('Nhập lương gross hợp lệ', 'warn'); return; }
    busy($('qbg'), 'Đang tính...', call('calcSalary', {base: g, dependents: $('qd').value, month: $('qm').value || S.today.slice(0,7)}).then(function(c){ showRes(c); })).catch(function(e){ $('qe').textContent = e.message; bad(e.message); });
  };
  $('qbn').onclick = function(){

    busy($('qbn'), 'Đang tính...', call('grossFromNet', {net: n, dependents: $('qd').value, month: $('qm').value || S.today.slice(0,7)})).then(function(r){
