  };
}

// Giá trị tham số đang hiệu lực tại một tháng (bản sao phía trình duyệt của cfgFor_ trong Code.gs, dùng để điền sẵn form)
function cfgAt(month){
  var out = {};
  Object.keys(S.config).forEach(function(k){ out[k] = S.config[k]; });
  S.periods.filter(function(p){ return p.key && String(p.from) <= month && (!p.to || month <= String(p.to)); })
    .sort(function(a, b){ return String(a.from).localeCompare(String(b.from)); })
    .forEach(function(p){ out[p.key] = String(p.value); });
  return out;
}
function sameCfgVal(k, a, b){
  a = String(a == null ? '' : a).trim(); b = String(b == null ? '' : b).trim();
  if (a === b) return true;
  if (k === 'taxBrackets' || k === 'regionMin' || k === 'sellTaxTypes') return false;
  return a !== '' && b !== '' && !isNaN(Number(a)) && !isNaN(Number(b)) && Number(a) === Number(b);
}
function prevMonth(m){
  var y = Number(m.slice(0, 4)), mo = Number(m.slice(5, 7)) - 1;
  if (mo < 1){ mo = 12; y--; }
  return y + '-' + (mo < 10 ? '0' : '') + mo;
}
// Thêm giai đoạn: điền sẵn giá trị của THÁNG TRƯỚC gần nhất so với tháng bắt đầu để tham khảo;
// chỉ tham số khác với giá trị đang hiệu lực tại tháng bắt đầu mới được lưu (khớp savePeriodBatch_ trong Code.gs)
function openPeriodBatch(){
  var from = S.today.slice(0, 7), base = cfgAt(from), ref = cfgAt(prevMonth(from)), touched = {};
  var h = '<h2>Thêm giai đoạn áp dụng</h2><form id="pf">' +
    '<div class="note" style="margin:0">Các ô bên dưới đang điền sẵn giá trị của <b id="prefm"></b> (tháng liền trước tháng bắt đầu) để bạn tham khảo. Chỉ những ô khác với giá trị đang áp dụng tại tháng bắt đầu mới được lưu cho giai đoạn này (ô đổi được tô vàng). Đổi tháng bắt đầu thì các ô bạn chưa sửa tự cập nhật theo tháng liền trước đó.</div>' +
    '<div class="two"><div><label>Áp dụng từ tháng</label><input id="pfrom" type="month" value="' + esc(from) + '"></div>' +
    '<div><label>Đến hết tháng (trống = không giới hạn)</label><input id="pto" type="month"></div></div>' +
    '<label>Ghi chú</label><input id="pnote" type="text" placeholder="VD: Quy định 2024-2025">';
  S.configInfo.forEach(function(i){
    h += '<label>' + esc(i.key) + ' <span style="font-weight:400">— ' + esc(i.desc) + '</span></label><input data-pk="' + esc(i.key) + '" value="' + esc(ref[i.key]) + '">';
  });
  h += '<div class="sub" id="pcount" style="margin-top:10px"></div><div class="err" id="perr"></div>' +
    '<div class="acts"><button type="button" class="btn ghost" id="pc">Hủy</button><button type="submit" class="btn" id="ps">Lưu giai đoạn</button></div></form>';
  $('dlgBody').innerHTML = h;
  var inputs = [].slice.call(document.querySelectorAll('#pf [data-pk]'));
  function refresh(){
    $('prefm').textContent = 'tháng ' + prevMonth($('pfrom').value || from);
    var changed = [];
    inputs.forEach(function(el){
      var k = el.dataset.pk, diff = !sameCfgVal(k, el.value, base[k]) && String(el.value).trim() !== '';
      el.classList.toggle('chg', diff);
      if (diff) changed.push(k);
    });
    $('pcount').textContent = changed.length ? 'Sẽ lưu ' + changed.length + ' tham số thay đổi: ' + changed.join(', ') : 'Chưa sửa tham số nào.';
  }
  $('pf').addEventListener('input', function(e){
    var k = e.target.dataset && e.target.dataset.pk;
    if (k){ touched[k] = true; refresh(); }
  });
  $('pfrom').addEventListener('change', function(){
    if (!/^\d{4}-\d{2}$/.test(this.value)) return;
    base = cfgAt(this.value); ref = cfgAt(prevMonth(this.value));
    inputs.forEach(function(el){ if (!touched[el.dataset.pk]) el.value = ref[el.dataset.pk]; });
    refresh();
  });
  $('pc').onclick = function(){ $('dlg').close(); toast('Đã hủy, không lưu thay đổi', 'info'); };
  $('pf').onsubmit = function(ev){
    ev.preventDefault();
    $('perr').textContent = '';
    var values = {};
    inputs.forEach(function(el){ values[el.dataset.pk] = el.value.trim(); });
    var payload = {from: $('pfrom').value, to: $('pto').value, note: $('pnote').value, values: values};
    busy([$('ps'), $('pc')], 'Đang lưu...', call('savePeriodBatch', payload).then(function(r){
      $('dlg').close(); ok('Đã lưu giai đoạn: ' + r.created + ' tham số (' + r.keys.join(', ') + ')'); return load();
    })).catch(function(e){ $('perr').textContent = e.message; bad(e.message); });
  };
  refresh();
  $('dlg').showModal();
}


// ---- Giai đoạn áp dụng: phân trang 10 dòng + tra cứu nhanh ----
var PER_PAGE = 10, perPage = 1, perFilter = '', perMonth = '', perOnlyChanged = true;
function periodKeyOf(p){ return String(p.from) + '|' + String(p.to || ''); }
function periodLabel(from, to){ return from + ' → ' + (to ? to : 'không giới hạn'); }
function cfgSourceAt(month){
  var out = {};
  Object.keys(S.config).forEach(function(k){ out[k] = {value: String(S.config[k]), src: null}; });
  S.periods.filter(function(p){ return p.key && String(p.from) <= month && (!p.to || month <= String(p.to)); })
    .sort(function(a, b){ return String(a.from).localeCompare(String(b.from)); })
    .forEach(function(p){ out[p.key] = {value: String(p.value), src: p}; });
  return out;
}
function lookupHtml(){
  if (!/^\d{4}-\d{2}$/.test(perMonth)) return '';
  var src = cfgSourceAt(perMonth), keys = S.configInfo.map(function(i){ return i.key; });
  var desc = {}; S.configInfo.forEach(function(i){ desc[i.key] = i.desc; });
  var changed = keys.filter(function(k){ return src[k] && src[k].src; });
  var show = perOnlyChanged ? changed : keys;
  var h = '<div class="lk"><div class="row" style="margin:0 0 8px"><b>Cài đặt áp dụng tại tháng ' + esc(perMonth) + '</b><span class="sub">' + changed.length + '/' + keys.length + ' tham số do giai đoạn thay đổi</span></div>';
  if (!show.length) h += '<div class="sub">Tháng này không có giai đoạn nào thay đổi tham số, đang dùng toàn bộ cài đặt gốc.</div>';
  else {
    h += '<div class="scroll"><table><thead><tr><th>Tham số</th><th>Giá trị</th><th>Nguồn</th></tr></thead><tbody>' + show.map(function(k){
      var o = src[k];
      return '<tr class="' + (o.src ? 'ov' : '') + '"><td><b>' + esc(k) + '</b><div class="sub">' + esc(desc[k] || '') + '</div></td><td class="v">' + esc(o.value) + '</td><td>' +
        (o.src ? '<span class="badge o">Giai đoạn ' + esc(periodLabel(o.src.from, o.src.to)) + '</span>' : '<span class="sub">Cài đặt gốc</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  }
  return h + '</div>';
}
function drawPeriods(){
  var box = $('perBox'); if (!box) return;
  if (!S.periods.length){ box.innerHTML = '<div class="empty">Chưa có giai đoạn nào.</div>'; return; }
  // các khoảng thời gian khác nhau, mới nhất trước
  var seen = {}, groups = [];
  S.periods.forEach(function(p){ var k = periodKeyOf(p); if (!seen[k]){ seen[k] = 1; groups.push({k: k, from: String(p.from), to: String(p.to || '')}); } });
  groups.sort(function(a, b){ return b.from.localeCompare(a.from) || (b.to || '9999').localeCompare(a.to || '9999'); });
  if (perFilter && !seen[perFilter]) perFilter = '';
  var rows = S.periods.filter(function(p){ return !perFilter || periodKeyOf(p) === perFilter; })
    .sort(function(a, b){ return String(b.from).localeCompare(String(a.from)) || String(a.key).localeCompare(String(b.key)); });
  var pages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
  if (perPage > pages) perPage = pages; if (perPage < 1) perPage = 1;
  var from = (perPage - 1) * PER_PAGE, slice = rows.slice(from, from + PER_PAGE);

  var h = '<div class="pl"><div><label>Tra cứu nhanh theo giai đoạn</label><select id="perSel"><option value="">— Chọn giai đoạn —</option>' +
    groups.map(function(g){ return '<option value="' + esc(g.k) + '"' + (g.k === perFilter ? ' selected' : '') + '>' + esc(periodLabel(g.from, g.to)) + '</option>'; }).join('') + '</select></div>' +
    '<div><label>…hoặc xem cài đặt tại tháng</label><input type="month" id="perMonth" value="' + esc(perMonth) + '" placeholder="yyyy-mm"></div>' +
    '<div style="flex:0 0 auto"><label style="display:flex;gap:6px;align-items:center;margin:0 0 10px"><input type="checkbox" id="perOnly"' + (perOnlyChanged ? ' checked' : '') + ' style="width:auto"> Chỉ hiện tham số bị thay đổi</label></div>' +
    (perFilter || perMonth ? '<div style="flex:0 0 auto"><button class="btn ghost" id="perClear" type="button">Bỏ chọn</button></div>' : '') + '</div>';
  h += lookupHtml();
  h += '<div class="scroll"><table><thead><tr><th>Từ tháng</th><th>Đến hết tháng</th><th>Tham số</th><th>Giá trị mới</th><th>Ghi chú</th><th></th></tr></thead><tbody>' +
    slice.map(function(p){
      return '<tr><td><b>' + esc(p.from) + '</b></td><td>' + (p.to ? '<b>' + esc(p.to) + '</b>' : '<span class="sub">không giới hạn</span>') + '</td><td>' + esc(p.key) + '</td><td style="word-break:break-all">' + esc(p.value) + '</td><td>' + esc(p.note) + '</td><td>' + acts('period', p.id) + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  h += '<div class="sub">Dòng ' + (rows.length ? from + 1 : 0) + '–' + (from + slice.length) + ' / ' + rows.length + (perFilter ? ' (đang lọc giai đoạn ' + esc(periodLabel.apply(null, perFilter.split('|'))) + ')' : '') + ' · mới nhất trước</div>';
  if (pages > 1) h += pagerHtml(perPage, pages);
  box.innerHTML = h;

  $('perSel').onchange = function(){
    perFilter = this.value; perPage = 1;
    if (perFilter) perMonth = perFilter.split('|')[0];
    drawPeriods();
  };
  $('perMonth').onchange = function(){
    perMonth = this.value;
    if (perFilter && perFilter.split('|')[0] !== perMonth) perFilter = '';
    perPage = 1; drawPeriods();
  };
  $('perOnly').onchange = function(){ perOnlyChanged = this.checked; drawPeriods(); };
  var clr = $('perClear'); if (clr) clr.onclick = function(){ perFilter = ''; perMonth = ''; perPage = 1; drawPeriods(); };
  [].forEach.call(box.querySelectorAll('[data-pg]'), function(b){
    b.onclick = function(){ perPage = Number(b.getAttribute('data-pg')); drawPeriods(); };
  });
}
function rCfg(){
  var h = '<div class="row"><h2>Giai đoạn áp dụng</h2><button class="btn" data-act="addPeriod">+ Thêm giai đoạn</button></div>';
  h += '<div class="note">Dùng khi quy định thay đổi theo thời gian (VD: trần BHXH tăng từ 07/2026, lương tối thiểu vùng năm 2027). Bấm "+ Thêm giai đoạn", chọn "Từ tháng" và (tùy chọn) "Đến hết tháng", form hiện sẵn giá trị của tháng liền trước để tham khảo; sửa ô nào thì chỉ ô đó được lưu (mỗi tham số thay đổi thành một dòng bên dưới, bấm Sửa để chỉnh từng dòng). Sau tháng kết thúc, tham số quay về giá trị trước đó. Mỗi tháng lương luôn tính theo tham số có hiệu lực tại chính tháng đó, nên thêm giai đoạn mới không làm đổi kết quả các tháng cũ. Giá trị gốc cho các tháng chưa thuộc giai đoạn nào lấy từ sheet CauHinh.</div>';
  h += '<div id="perBox"></div>';
  $('t-cfg').innerHTML = h;
  drawPeriods();
}


// Tự lấy giá ở nền khi mở app nếu có mã đặt giá tự động mà chưa cập nhật hôm nay (không chặn giao diện)
function autoRefreshIfStale(){
  if (!S || !S.prices) return;
  var stale = S.prices.some(function(x){ return String(x.auto || '').trim() && String(x.updated || '') !== S.today; });
  if (!stale) return;
  call('refreshPrices', {background: true}).then(function(r){ if (r.updated) { ok('Đã cập nhật giá tự động ' + r.updated + ' mã'); return load(); } }).catch(function(){});
}
load().then(autoRefreshIfStale);
</script>
